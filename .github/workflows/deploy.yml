name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already running:
# `deploy-pages` publishes in several steps, so killing it mid-flight can leave
# the site serving a half-uploaded artifact. Queueing costs a few minutes on a
# busy day; the alternative costs a broken site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase, if it is configured. Both variables are read at build time and
      # inlined into the bundle - that is what the EXPO_PUBLIC_ prefix means, and
      # it is correct here: the anon key is a public identifier and row-level
      # security is what protects the data. The service_role key must never be
      # put here; it bypasses RLS entirely.
      #
      # Unset secrets arrive as empty strings, which isBackendConfigured() reads
      # as "no backend" - so the build keeps working on a fork or before the
      # secrets exist, and the app simply stays local-only.
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4